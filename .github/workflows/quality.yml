name: TradingLAB quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-groups
      - run: uv run ruff format --check src tests v0_2_lean v0_3_paper v0_4_tradingview v0_5_forex v0_6_portfolio
      - run: uv run ruff check src tests v0_2_lean v0_3_paper v0_4_tradingview v0_5_forex v0_6_portfolio
      - run: uv run mypy
      - run: uv run pytest -q

  site:
    name: Sites interface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
