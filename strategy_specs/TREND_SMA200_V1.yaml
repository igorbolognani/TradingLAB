strategy_id: TREND_SMA200_V1
strategy_version: "1"
strategy_family: trend
hypothesis: Medium-to-long trends may improve return-adjusted behavior or drawdown versus Buy and Hold.
applicable_assets: [SPY, IWM, EFA, TLT, GLD]
timeframe: 1d_regular_session
price_basis: yahoo_total_return_adjusted_ohlc_v1
indicator_definitions:
