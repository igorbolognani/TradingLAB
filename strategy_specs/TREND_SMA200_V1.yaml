warmup_bars: 200
decision_time: after_confirmed_close_t
execution_time: next_valid_regular_session_open
entry_rule: close_gt_sma
exit_rule: close_lte_sma
position_sizing: {method: all_available_cash_integer, fractional_shares: false}
risk_constraints: {long_only: true, shorting: false, leverage: 1, pyramiding: false, cash_interest: 0}
parameters: {sma: 200, lookback: null, entry_z: null, exit_z: null, max_hold: null}
parameter_policy: frozen_primary_predeclared_ota_only
modeled_execution_friction:
  concept: modeled_all_in_execution_friction
  base_bps_per_side: 5
  sensitivity_bps_per_side: [0, 5, 10, 25]
