strategy_id: MEANREV_Z20_V1
strategy_version: "1"
strategy_family: mean_reversion
hypothesis: Large negative deviations may partially revert over a bounded holding period.
applicable_assets: [SPY, IWM, EFA, TLT, GLD]
timeframe: 1d_regular_session
price_basis: yahoo_total_return_adjusted_ohlc_v1
indicator_definitions:
  - {name: zscore, source: normalized_close, lookback: 20, min_periods: 20, standard_deviation_ddof: 0}
warmup_bars: 20
decision_time: after_confirmed_close_t
execution_time: next_valid_regular_session_open
entry_rule: flat_and_z_lte_entry
exit_rule: z_gte_exit_or_max_hold
position_sizing: {method: all_available_cash_integer, fractional_shares: false}
risk_constraints: {long_only: true, shorting: false, leverage: 1, pyramiding: false, cash_interest: 0}
parameters: {sma: null, lookback: 20, entry_z: -2.0, exit_z: 0.0, max_hold: 10}
parameter_policy: frozen_primary_predeclared_ota_only
modeled_execution_friction:
  concept: modeled_all_in_execution_friction
  base_bps_per_side: 5
  sensitivity_bps_per_side: [0, 5, 10, 25]
benchmark: matching_asset_buy_hold
expected_failure_modes:
  - persistent downtrends
  - falling-knife entries
  - adverse gaps
  - volatility-regime changes
  - low trade counts
  - strong execution-friction sensitivity
