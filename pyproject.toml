[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "tradinglab"
version = "0.1.0"
description = "Auditable local quantitative research laboratory"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Private local research; see README dependency boundary" }
dependencies = [
  "backtesting==0.6.6",
  "exchange-calendars==4.13.2",
  "matplotlib==3.11.1",
  "numpy==2.5.2",
  "pandas==3.0.5",
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
  "yfinance==1.6.0",
]

[project.scripts]
tradinglab = "tradinglab.cli:main"
tradinglab-dashboard = "tradinglab.dashboard_server:main"

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "pandas-stubs==3.0.5.260730",
  "pytest==9.1.1",
  "ruff==0.16.3",
  "types-PyYAML==6.0.12.20260815",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tradinglab"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = [
  "integration: explicit network integration test path",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
  "backtesting.*",
  "exchange_calendars.*",
  "matplotlib.*",
  "yfinance.*",
]
ignore_missing_imports = true
